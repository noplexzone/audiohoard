{% macro status(provider) -%}{% set item=client_statuses[provider] %}<span id="status-{{ provider }}" class="badge {{ 'ok' if item.available else ('info' if provider_states[provider] in ['Disabled','Not configured','Not checked'] else 'error') }}" data-connection-status><span class="dot"></span><span data-status-label>{{ provider_states[provider] }}</span>{% if item.checked_age_seconds is not none %}<span data-status-detail> · checked {{ item.checked_age_seconds }}s ago{% if item.elapsed_ms is not none %} · {{ item.elapsed_ms }}ms{% endif %}</span>{% endif %}</span>{%- endmacro %}
