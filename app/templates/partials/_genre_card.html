<article class="discover-poster-card discover-genre-card" data-provider="{{ item.provider | e }}" data-provider-id="{{ item.provider_id | e }}">
  <a class="discover-poster-link" href="/discover/genres/{{ item.provider_id | urlencode }}">{% if item.artwork_url %}<img src="/artwork?url={{ item.artwork_url | urlencode }}" alt="" class="discover-poster" width="480" height="480" loading="lazy" decoding="async">{% else %}<span class="discover-poster discover-poster-missing" aria-hidden="true"><strong>AH</strong><small>Audiohoard genre</small></span>{% endif %}<span class="discover-poster-overlay"><span class="badge info">{{ display_name(item.provider) }}</span></span></a>
  <div class="discover-card-body"><h3><a href="/discover/genres/{{ item.provider_id | urlencode }}">{{ item.name }}</a></h3><a class="btn discover-primary" href="/discover/genres/{{ item.provider_id | urlencode }}">Explore genre</a></div>
</article>
